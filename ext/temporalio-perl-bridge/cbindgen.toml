# ABOUTME: cbindgen configuration for the temporalio-perl-bridge shim crate.
# ABOUTME: build.rs renders src/lib.rs into include/temporalio-perl-bridge.h.

language = "C"
include_guard = "TEMPORALIO_PERL_BRIDGE_H"
cpp_compat = true
documentation = true
style = "both"
usize_is_size_t = true
autogen_warning = "/* Generated by cbindgen from temporalio-perl-bridge — do not edit by hand. */"

# The TemporalCore* types belong to temporal-sdk-core-c-bridge.h; emit only
# forward declarations so both headers can coexist in one translation unit.
# (Only the types that appear in exported shim signatures need a typedef —
# the WorkerOptions tree is referenced solely as a pointer.)
after_includes = """
typedef struct TemporalCoreByteArray TemporalCoreByteArray;
typedef struct TemporalCoreConnection TemporalCoreConnection;
typedef struct TemporalCoreEphemeralServer TemporalCoreEphemeralServer;
typedef struct TemporalCoreWorkerOptions TemporalCoreWorkerOptions;
typedef struct TemporalCoreCustomMetricAttribute TemporalCoreCustomMetricAttribute;"""

[export]
exclude = [
  "TemporalCoreByteArray",
  "TemporalCoreConnection",
  "TemporalCoreEphemeralServer",
  # WorkerOptions layout mirrors (plan P0.10) — defined by the core bridge
  # header; the shim only parses them, so the header must not redefine them.
  "TemporalCoreByteArrayRef",
  "TemporalCoreByteArrayRefArray",
  "TemporalCoreWorkerVersioningNone",
  "TemporalCoreWorkerDeploymentVersion",
  "TemporalCoreWorkerDeploymentOptions",
  "TemporalCoreLegacyBuildIdBasedStrategy",
  "TemporalCoreWorkerVersioningStrategy",
  "TemporalCoreFixedSizeSlotSupplier",
  "TemporalCoreResourceBasedTunerOptions",
  "TemporalCoreResourceBasedSlotSupplier",
  "TemporalCoreCustomSlotSupplierCallbacksImpl",
  "TemporalCoreSlotSupplier",
  "TemporalCoreTunerHolder",
  "TemporalCoreWorkerTaskTypes",
  "TemporalCorePollerBehaviorSimpleMaximum",
  "TemporalCorePollerBehaviorAutoscaling",
  "TemporalCorePollerBehavior",
  "TemporalCoreWorkerOptions",
  # Custom-metric attribute types (spec section 28.2) — defined by the core
  # bridge header; the shim only parses them, so the header must not redefine.
  "TemporalCoreCustomMetricAttributeValueString",
  "TemporalCoreCustomMetricAttributeValue",
  "TemporalCoreCustomMetricAttribute",
]
